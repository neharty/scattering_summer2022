[WAVE]
#input wave parameters
type=g
time_shift=15 
src_type=pointsource
width=0.5
r0=[0, 0]

[CYLS]
#cylinder generation parameters
geometry=circ
bcs=['d']
rho=0.2
rout=10
rin=0
dmin=0.1
a=0.25
bc_mode=random
impedance=M120

[TDS]
#time domain solver parameters
T=80
Nt=14
tint=irk5
use_par=True
use_cython=True
cpus=8
