[WAVE]
#input wave parameters
type=g
time_shift=12 
src_type=pointsource
sigma=0.2
r0=[0, 0]

[CYLS]
#cylinder generation parameters
geometry=circ
bcs=['d', 'n']
rho=0.05
rout=10
rin=3
dmin=0.1
a=0.25
bc_mode=random
impedance=M120

[TDS]
#time domain solver parameters
T=40
Nt=12
tint=irk5
use_par=True
use_cython=True
cpus=8
