[WAVE]
#input wave parameters
type=g
time_shift=15 
src_type=pointsource
width=0.5
r0=[0, 0]

[CYLS]
#cylinder generation parameters
geometry=rect
Lx=5
Ly=10
dmin=0.2
Lxin=0
Lyin=0
rho=0.2
a=0.25
bcs=['d', 'n']
bc_mode=random
impedance=M120

[TDS]
#time domain solver parameters
T=40
Nt=12
tint=irk5
use_par=True
use_cython=True
cpus=8
mode_tol=1e-8
